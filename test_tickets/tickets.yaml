# Eval set — 20 tickets across four categories, 5 each.
# `expected_decision` and `expected_reason` are what the pipeline *should*
# return. `expected_source_any_of` (optional) lists KB IDs; if ANY of them
# appears in the cited sources we count it as a source-hit.
#
# Language mix is intentional: English-majority with a sprinkle of
# Russian/Ukrainian/Portuguese to reflect Growe's Asia / Africa / LatAm
# footprint.

# --- Category A: should answer -------------------------------------------

- id: A1
  text: "How do I withdraw to my Visa card? What are the fees and limits?"
  category: answer
  expected_decision: answer
  expected_source_any_of: [kb_005]

- id: A2
  text: "Забыл пароль, не могу войти в аккаунт. Как сбросить?"
  category: answer
  expected_decision: answer
  expected_source_any_of: [kb_016]

- id: A3
  text: "I claimed the 100% welcome bonus and it says 35x wagering. What exactly does that mean and how much do I need to bet?"
  category: answer
  expected_decision: answer
  expected_source_any_of: [kb_012]

- id: A4
  text: "I uploaded my passport 2 hours ago. How long does KYC verification take usually?"
  category: answer
  expected_decision: answer
  expected_source_any_of: [kb_003, kb_001]

- id: A5
  text: "Deposited via USDT TRC20 40 minutes ago, tx is confirmed on chain but my balance didn't change. What do I do?"
  category: answer
  expected_decision: answer
  expected_source_any_of: [kb_011, kb_009]

